<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Message sent | Aziz Alghamdi</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0A121E">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="assets/css/site.css">
    <script src="assets/js/site.js" defer></script>
    <style>
        .msg { min-height: calc(100vh - var(--header-h) - 260px); display: grid; place-items: center; padding: 80px 0; }
        .msg__box { max-width: 520px; }
        .msg__icon { width: 52px; height: 52px; border-radius: 12px; display: grid; place-items: center; background: rgba(61,190,139,.14); color: var(--ok); font-size: 22px; margin-bottom: 20px; }
        .msg h1 { margin: 0 0 10px; font-size: var(--fs-2xl); font-weight: 600; }
        .msg p { color: var(--text-2); margin: 0 0 24px; }
        .msg .row { display: flex; gap: 10px; flex-wrap: wrap; }
    </style>
</head>
<body data-i18n-page>
<main id="main" class="msg">
    <div class="sx-wrap msg__box">
        <div class="msg__icon"><i class="fas fa-check" aria-hidden="true"></i></div>
        <h1 data-ar="تم إرسال رسالتك">Your message is on its way</h1>
        <p data-ar="شكرًا لتواصلك. سأرد على البريد الذي كتبته في النموذج.">Thanks for reaching out. I will reply to the email address you entered in the form.</p>
        <div class="row">
            <a class="sx-btn sx-btn--primary" href="index.html" data-ar="العودة للرئيسية">Back to home</a>
            <a class="sx-btn sx-btn--ghost" href="Interactive_Section/html/interactive-section.html" data-ar="تصفح المختبرات">Browse the labs</a>
        </div>
    </div>
</main>
</body>
</html>
