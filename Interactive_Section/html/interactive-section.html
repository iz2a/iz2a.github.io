<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Labs & Simulations | Aziz Alghamdi</title>
    <meta name="description" content="Hands-on cybersecurity labs and simulations: SOC, EDR, penetration testing, cloud security, digital forensics, OWASP, cryptography and more.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/lab-polish.css">
    <style>
        .labx-hero { padding: 46px 0 10px; }
        .labx-hero h1 { font-size: 34px; }
        .labx-lead { max-width: 820px; color: #495057; font-size: 17px; line-height: 1.7; margin-top: 8px; }
        .labx-filter { display: flex; flex-wrap: wrap; gap: 8px; margin: 26px 0 10px; }
        .labx-fbtn { background: #fff; border: 1px solid #d7dce2; color: #495057; border-radius: 999px; padding: 7px 15px; font: 500 14px var(--font-body,sans-serif); cursor: pointer; }
        .labx-fbtn:hover { border-color: #495057; color: #212529; }
        .labx-fbtn.active { background: #212529; color: #fff; border-color: #212529; }
        .labx-group { margin: 30px 0 6px; }
        .labx-group h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .05em; color: #6c757d; border-bottom: 1px solid #e3e7ec; padding-bottom: 8px; }
        .labx-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; margin: 16px 0 8px; }
        .labx-card { display: flex; flex-direction: column; background: #fff; border: 1px solid #e3e7ec; border-radius: 12px; padding: 20px; text-decoration: none; transition: transform .15s, box-shadow .15s, border-color .15s; }
        .labx-card:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(20,30,45,.08); border-color: #cfd6de; }
        .labx-top { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .labx-ico { width: 44px; height: 44px; border-radius: 10px; background: #212529; color: #fff; display: grid; place-items: center; font-size: 19px; flex-shrink: 0; }
        .labx-ico.sim { background: #1d3a5f; }
        .labx-ico.off { background: #6b2020; }
        .labx-ico.grc { background: #1f5138; }
        .labx-ico.fun { background: #4a3a6b; }
        .labx-name { font-family: var(--font-head, Georgia, serif); font-size: 18px; font-weight: 600; color: #212529; line-height: 1.25; }
        .labx-tagline { font-size: 12px; color: #8a94a0; text-transform: uppercase; letter-spacing: .03em; margin-top: 2px; }
        .labx-desc { color: #56606b; font-size: 14px; line-height: 1.6; flex: 1; }
        .labx-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
        .labx-tag { background: #f1f3f6; color: #56606b; border-radius: 6px; padding: 3px 9px; font-size: 12px; }
        .labx-go { margin-top: 14px; color: #1d3a5f; font-weight: 600; font-size: 14px; }
        .labx-go i { transition: transform .15s; }
        .labx-card:hover .labx-go i { transform: translateX(4px); }
    </style>
</head>
<body data-lab="labs-index">

<main id="main">
    <section class="labx-hero">
        <div class="container">
            <h1 class="section-title cyber-accent">Interactive Labs &amp; Simulations</h1>
            <p class="labx-lead">Hands-on environments that mirror the tools and decisions of real security work: run a SOC shift, harden a cloud account, work a forensics case, or drive a full penetration test. Everything runs in your browser. Use the filters to jump to an area.</p>
            <div class="labx-filter" id="labx-filter">
                <button class="labx-fbtn active" data-cat="all">All</button>
                <button class="labx-fbtn" data-cat="blue">Blue Team</button>
                <button class="labx-fbtn" data-cat="offensive">Offensive</button>
                <button class="labx-fbtn" data-cat="network">Network</button>
                <button class="labx-fbtn" data-cat="cloud">Cloud &amp; Architecture</button>
                <button class="labx-fbtn" data-cat="grc">GRC</button>
                <button class="labx-fbtn" data-cat="fundamentals">Fundamentals</button>
                <button class="labx-fbtn" data-cat="challenge">Challenges</button>
            </div>
        </div>
    </section>

    <div class="container" id="labx-container"></div>
</main>

<script src="/translator.js"></script>
<script src="/lab-frame.js"></script>
<script>
(function () {
    var LABS = [
        { f:'soc-simulation.html', name:'SOC Analyst Simulation', tag:'Simulation', cat:'blue', kind:'sim', icon:'fa-shield-halved',
          desc:'Run a shift in a Security Operations Center. Triage a live ransomware intrusion across a SIEM, investigate the timeline, and contain it before it spreads.', tags:['SIEM','Incident Response','MITRE ATT&CK'] },
        { f:'edr-lab.html', name:'Endpoint Defense Lab', tag:'Simulation', cat:'blue', kind:'sim', icon:'fa-laptop-medical',
          desc:'Work an EDR console: analyze suspicious processes, respond to endpoint threats, and run file integrity monitoring against baseline hashes.', tags:['EDR','Process Tree','File Integrity'] },
        { f:'digital-forensics.html', name:'Digital Forensics Simulation', tag:'Simulation', cat:'blue', kind:'sim', icon:'fa-fingerprint',
          desc:'Work a full DFIR case. Acquire a disk image, memory dump, network logs and a seized Android phone, then build the evidence and name the culprit.', tags:['DFIR','Mobile Forensics','Chain of Custody'] },
        { f:'pentest-lab.html', name:'Penetration Testing Lab', tag:'Lab', cat:'offensive', kind:'off', icon:'fa-user-secret',
          desc:'Drive a full penetration test through recon, CVSS-scored vulnerability scanning, exploitation, post-exploitation and reporting.', tags:['Metasploit','CVSS','Exploitation'] },
        { f:'owasp-workshop.html', name:'OWASP Top 10 Workshop', tag:'Workshop', cat:'offensive', kind:'off', icon:'fa-bug',
          desc:'Identify, exploit and fix the most critical web application flaws: injection, broken access control, XSS and more.', tags:['Web Security','Injection','XSS'] },
        { f:'../../hack/web_hack_challenge.html', name:'Web Hacking Challenge', tag:'Challenge', cat:'offensive', kind:'off', icon:'fa-code',
          desc:'A hands-on web exploitation challenge. Find and abuse the hidden weaknesses in a deliberately vulnerable application.', tags:['Web Exploitation'] },
        { f:'network-toolkit.html', name:'Network Security Toolkit', tag:'Lab', cat:'network', kind:'off', icon:'fa-network-wired',
          desc:'Analyze traffic with a Wireshark-style capture, scan with Nmap, tune firewall rules and read IDS alerts.', tags:['Wireshark','Nmap','IDS'] },
        { f:'network-playground.html', name:'Network Security Playground', tag:'Simulation', cat:'network', kind:'sim', icon:'fa-diagram-project',
          desc:'Simulate attacks and defenses on a live network topology and watch how controls change the outcome.', tags:['Attack & Defense','Topology'] },
        { f:'cloud-security.html', name:'Cloud Security Sandbox', tag:'Simulation', cat:'cloud', kind:'sim', icon:'fa-cloud',
          desc:'Harden a cloud account across IAM, security groups, storage, logging and incident response, graded like a CSPM posture report.', tags:['IAM','CIS Benchmark','CSPM'] },
        { f:'architecture-designer.html', name:'Secure Architecture Designer', tag:'Lab', cat:'cloud', kind:'sim', icon:'fa-sitemap',
          desc:'Design defense-in-depth and zero-trust architectures by placing controls against real scenarios.', tags:['Zero Trust','Defense in Depth'] },
        { f:'compliance-navigator.html', name:'Compliance Navigator', tag:'Lab', cat:'grc', kind:'grc', icon:'fa-clipboard-check',
          desc:'Compare NIST CSF, ISO 27001 and CIS Benchmarks and map controls across frameworks the way a GRC engagement does.', tags:['NIST CSF','ISO 27001','CIS'] },
        { f:'automation-workshop.html', name:'Security Automation Workshop', tag:'Workshop', cat:'grc', kind:'grc', icon:'fa-gears',
          desc:'Build orchestrated response playbooks and automate repetitive security tasks (SOAR).', tags:['SOAR','Playbooks'] },
        { f:'encryption-playground.html', name:'Encryption Playground', tag:'Lab', cat:'fundamentals', kind:'fun', icon:'fa-lock',
          desc:'Experiment with Caesar, Vigenère, AES-256 and RSA in real time with step-by-step explanations.', tags:['AES','RSA','Ciphers'] },
        { f:'password_security.html', name:'Password Security Analyzer', tag:'Lab', cat:'fundamentals', kind:'fun', icon:'fa-key',
          desc:'Test password strength, generate strong passwords and learn how cracking and common weaknesses actually work.', tags:['Hashing','Strength','Entropy'] },
        { f:'social-engineering-quiz.html', name:'Social Engineering Quiz', tag:'Quiz', cat:'fundamentals', kind:'fun', icon:'fa-user-tag',
          desc:'Spot phishing, pretexting and other social engineering attacks, and learn the warning signs.', tags:['Phishing','Awareness'] },
        { f:'ctf-game.html', name:'Capture The Flag', tag:'Challenge', cat:'challenge', kind:'fun', icon:'fa-flag',
          desc:'A gamified investigation: follow the clues, find the hidden information and capture the flag.', tags:['CTF','Investigation'] },
        { f:'../../Terminal_Game/index.html', name:'Terminal Challenge', tag:'Challenge', cat:'challenge', kind:'fun', icon:'fa-terminal',
          desc:'Solve security tasks from a simulated command line and sharpen your terminal skills.', tags:['CLI','Puzzles'] }
    ];
    var GROUPS = [
        ['blue','Blue Team & Detection'],
        ['offensive','Offensive Security'],
        ['network','Network Security'],
        ['cloud','Cloud & Architecture'],
        ['grc','Governance, Risk & Compliance'],
        ['fundamentals','Fundamentals'],
        ['challenge','Challenges']
    ];
    function card(l){
        return '<a href="'+l.f+'" class="labx-card" data-cat="'+l.cat+'">'+
            '<div class="labx-top"><div class="labx-ico '+l.kind+'"><i class="fas '+l.icon+'"></i></div>'+
            '<div><div class="labx-name">'+l.name+'</div><div class="labx-tagline">'+l.tag+'</div></div></div>'+
            '<div class="labx-desc">'+l.desc+'</div>'+
            '<div class="labx-tags">'+l.tags.map(function(t){return '<span class="labx-tag">'+t+'</span>';}).join('')+'</div>'+
            '<div class="labx-go">Open <i class="fas fa-arrow-right"></i></div></a>';
    }
    function render(cat){
        var c=document.getElementById('labx-container');
        var html='';
        GROUPS.forEach(function(g){
            var items=LABS.filter(function(l){return l.cat===g[0] && (cat==='all'||l.cat===cat);});
            if(!items.length) return;
            html+='<div class="labx-group"><h2>'+g[1]+'</h2></div><div class="labx-grid">'+items.map(card).join('')+'</div>';
        });
        c.innerHTML=html;
    }
    document.addEventListener('DOMContentLoaded', function(){
        render('all');
        document.getElementById('labx-filter').addEventListener('click', function(e){
            var b=e.target.closest('.labx-fbtn'); if(!b) return;
            document.querySelectorAll('.labx-fbtn').forEach(function(x){x.classList.remove('active');});
            b.classList.add('active'); render(b.dataset.cat);
        });
    });
})();
</script>
</body>
</html>
